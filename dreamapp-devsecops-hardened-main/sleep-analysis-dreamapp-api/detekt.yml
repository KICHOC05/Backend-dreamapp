build:
  # Baseline: pre-existing legacy issues. Reduce over time.
  maxIssues: 50

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
  LargeClass:
    threshold: 600

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  WildcardImport:
    active: false
  NewLineAtEndOfFile:
    active: false
  UnusedPrivateProperty:
    active: false

naming:
  InvalidPackageDeclaration:
    active: false
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9_]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  MemberNameEqualsClassName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true
  EmptyKtFile:
    active: false
